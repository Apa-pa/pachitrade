<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="auto" role="img" aria-label="PACHI-TRADE Full Logo">
  <g id="candlesticks">
    <!-- Candle 1: Bearish (Open y=42 -> Close y=92) -->
    <line x1="18" y1="24" x2="18" y2="106" stroke="#F5B731" stroke-width="2.8" stroke-linecap="round" />
    <rect x="12" y="42" width="12" height="50" rx="2" fill="#F5B731" />

    <!-- Candle 2: Bullish (Open y=92 -> Close y=48) -->
    <line x1="36" y1="34" x2="36" y2="104" stroke="#00D09C" stroke-width="2.8" stroke-linecap="round" />
    <rect x="30" y="48" width="12" height="44" rx="2" fill="#00D09C" />

    <!-- Candle 3: Bullish (Open y=48 -> Close y=24) -->
    <line x1="54" y1="12" x2="54" y2="58" stroke="#00D09C" stroke-width="2.8" stroke-linecap="round" />
    <rect x="48" y="24" width="12" height="24" rx="2" fill="#00D09C" />
  </g>
  <g id="slot-reel" fill="none" stroke="#F8FAFC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Drum outer silhouette -->
    <path d="M 68 28 L 96 28 C 106 28, 109 42, 109 60 C 109 78, 106 92, 96 92 L 68 92" />
    <!-- Subtle vertical curved reel divider -->
    <path d="M 84 28 C 89 42, 89 78, 84 92" />
    <!-- Horizontal row dividers -->
    <line x1="68" y1="49" x2="107.5" y2="49" />
    <line x1="68" y1="71" x2="107.5" y2="71" />
    <!-- Lever arm -->
    <path d="M 109 62 L 117 62 C 121 62, 122 60, 122 56 L 122 39" />
  </g>
  <circle cx="122" cy="34" r="4.6" fill="#F8FAFC" />
  <text x="142" y="75" fill="#F8FAFC" font-family="'Outfit', 'Inter', sans-serif" font-size="44" font-weight="700" letter-spacing="0.06em">PACHI-TRADE</text>
</svg>