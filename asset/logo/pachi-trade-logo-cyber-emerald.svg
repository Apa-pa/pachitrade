<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 120" width="100%" height="auto" role="img" aria-label="PACHI-TRADE Logo">
  <g id="icon-candlesticks-reel">
    <!-- Candle 1: Bearish (Open y=58 -> Close y=92) -->
    <line x1="18" y1="44" x2="18" y2="100" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <rect x="12" y="58" width="12" height="34" rx="1.5" fill="#FBBF24" />

    <!-- Candle 2: Bullish (Open y=92 -> Close y=48) -->
    <line x1="36" y1="38" x2="36" y2="106" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <rect x="30" y="48" width="12" height="44" rx="1.5" fill="#10B981" />

    <!-- Candle 3: Bullish (Open y=48 -> Close y=24) -->
    <line x1="54" y1="14" x2="54" y2="56" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <rect x="48" y="24" width="12" height="24" rx="1.5" fill="#10B981" />

    <!-- Slot Machine Reel Drum Silhouette (7px gap after Candle 3 -> x=67) -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer cylindrical drum frame (open left, curved right) -->
      <path d="M 67 28 L 95 28 C 105 28, 108 42, 108 60 C 108 78, 105 92, 95 92 L 67 92" />
      <!-- Inner curved vertical reel divider -->
      <path d="M 83 28 C 88 42, 88 78, 83 92" />
      <!-- Horizontal payline / row dividers (3 rows) -->
      <line x1="67" y1="49" x2="106.5" y2="49" />
      <line x1="67" y1="71" x2="106.5" y2="71" />
      <!-- Classic slot lever arm -->
      <path d="M 108 62 L 116 62 C 120 62, 121 60, 121 56 L 121 39" />
    </g>
    <!-- Slot lever knob -->
    <circle cx="121" cy="34" r="5" fill="#FFFFFF" />
  </g>
  <!-- Typography: PACHI-TRADE -->
  <text
    x="144"
    y="74.5"
    fill="#FFFFFF"
    font-family="'Montserrat', 'Inter', sans-serif"
    font-size="41"
    font-weight="700"
    letter-spacing="0.06em"
  >PACHI-TRADE</text>
</svg>